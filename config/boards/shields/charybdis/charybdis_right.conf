# =======================================================
#  CHARYBDIS RIGHT -- central + trackball
#  Central-only: Studio + every *_STUDIO_RPC symbol, the
#  trackball stack, runtime macro/combo, default layer,
#  watchdog RPC. Shared base features live in charybdis.conf.
#
#  RULE: no inline comments on CONFIG_<name>=<value> lines.
#  Kconfig reads everything after '=' as the value; Zephyr
#  aborts the build on the resulting warning.
# =======================================================

# ---------- bus / input ----------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# ---------- PMW3610 (cormoran driver) ----------
# CPI is NOT here: it is a devicetree property (cpi = <1600>)
# that Studio overrides live at runtime.
# SWAP_XY replaces ORIENTATION_90.
CONFIG_PMW3610=y
CONFIG_PMW3610_SWAP_XY=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_SMART_ALGORITHM=y

# rest / downshift tuning, carried over from the v0.3 build
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=2000
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=5000
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=50
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=100

# ---------- Studio core ----------
# Central only by design: the left has no studio-rpc-usb-uart snippet, so
# proto/zmk/custom.pb.h is never generated there, and ZMK_STUDIO=y in the
# shared conf used to auto-enable every default-y *_STUDIO_RPC symbol on
# the peripheral and break its link.
# LOCKING=n kills the 600s auto-lock banner.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

# ---------- Studio RPC buffers (DO NOT DELETE) ----------
# Fork defaults are TX=64 / RX=30. TX has a BUILD_ASSERT; RX has NONE, so
# an undersized RX builds green and fails at runtime on the first frame
# capture or settings blob. ~10 custom subsystems are now registered on
# this image (pmw3610, rip, ble_management, settings_rpc, device_info,
# kscan_diagnostics, runtime_macro, runtime_combo, default_layer,
# os_detection, watchdog).
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
# Every settings write, CaptureFrame, Device Info / BLE management read and
# macro/combo list is a custom-subsystem request. Too small = silent
# rejection, no error. (Fork default 25, then 96.)
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256

# ---------- Studio custom RPC tabs ----------
# Trackball tab needs BOTH tiers: STUDIO_RPC alone gives diagnostics and
# frame capture only, NOT editable settings. That two-tier split is the
# classic "tab says Unsupported" failure.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# ---------- Runtime input processors (snipe / scroll / inertia) ----------
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ---------- Runtime macros & combos: CENTRAL ONLY ----------
# The peripheral image does not compile src/keymap.c,
# src/events/keycode_state_changed.c or src/behavior_queue.c -- they sit
# inside the "(NOT ZMK_SPLIT) OR ZMK_SPLIT_ROLE_CENTRAL" block of
# app/CMakeLists.txt. Enabling these on the left = undefined references.
# The central runs the keymap for BOTH halves, so bindings on left-hand
# positions still fire; nothing is lost.
# MAX_BYTES is range-bounded by ZMK_CUSTOM_SETTINGS_VALUE_MAX_SIZE ..
# ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE, so raise the ceiling together.
# POOL_BYTES is the shared name+body budget; LOCAL_ID_TYPE is required
# because both features select ZMK_BEHAVIOR_LOCAL_IDS.
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# ---------- OS detection + per-OS default layer ----------
# MIN/MAX default to 0/0 -- out of the box the feature looks dead but is
# just clamped. The window is CONTIGUOUS and inclusive, so it cannot cover
# the reserved Studio layers (4+) while excluding scroll_gate at index 3.
# 0..2 = QWERTY / F / BT only. To widen to 6, move scroll_gate to the last
# index (7) first: #define SCROLL_L, scroll_rip active-layers and
# mouse_rip active-layers in charybdis_right.overlay.
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=2
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y

# ---------- Watchdog ----------
# Base symbol is in charybdis.conf (both halves) so each half records its
# own incidents. Freeze detect is held off there -- this is a working BLE
# split central and the module documents a low-probability k_timer vs
# radio-event-prep conflict. Arm it here, conservatively, once stable:
#   CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y
#   CONFIG_ZMK_WATCHDOG_FREEZE_FEED_DIVISOR=4
#   CONFIG_ZMK_WATCHDOG_FREEZE_MONITOR_LOWPRIO_QUEUE=n
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# ---------- Threads / stacks ----------
# NOT OPTIONAL. RIP cannot raise this shared thread's stack itself -- a ZMK
# Kconfig default outranks the module's, and without this the firmware faults
# the first time Studio lists the processors. 4096 matches the dya2.
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096

# ---------- Split role ----------
# right = CENTRAL. Do NOT assign CONFIG_ZMK_SPLIT_BLE_ROLE_CENTRAL here:
# it has no prompt, so it cannot be set from a .conf. The shield
# Kconfig.defconfig already does it via SHIELD_CHARYBDIS_RIGHT.
#
# The generic split relay IS live: kscan diagnostics' _SPLIT option selects
# ZMK_SPLIT_RELAY_EVENT on both halves, and watchdog's
# ZMK_WATCHDOG_SPLIT_RELAY (default y under ZMK_SPLIT) rides it -- that is
# how Studio reaches the left half's matrix and incident log. Ceiling is in
# charybdis.conf (DATA_LEN=256, asserted by kscan diagnostics).
#
# Still deliberately ABSENT: CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY. The sensor
# is local to the central, so the pmw3610-specific relay never enters this
# build.
CONFIG_ZMK_SPLIT=y
