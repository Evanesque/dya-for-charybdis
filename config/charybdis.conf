# =======================================================
#  CHARYBDIS -- shared conf, applied to BOTH halves.
#  Central-only (Studio, RIP, default layer) lives in
#  charybdis_right.conf. Keymap-level features (runtime
#  macro/combo) are central-only by construction.
# =======================================================

# ---------- Bluetooth link / buffers ----------
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ---------- Clock: external 32K crystal, tighter tolerance ----------
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_30PPM=y

# ---------- ZMK core ----------
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
CONFIG_ZMK_EXT_POWER=y

# ---------- Split battery reporting (central polls the peripheral) ----------
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# ---------- Identity ----------
# Same name on both halves: harmless, the peripheral isn't advertised
# separately. Change only if you ever pair a half on its own.
CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

# ---------- Matrix debounce knobs (left commented: current tuning OK) ----------
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# =======================================================
#  Studio is NOT here -- it is central-only.
#  The left has no studio-rpc-usb-uart snippet, so
#  proto/zmk/custom.pb.h is never generated there. With
#  ZMK_STUDIO=y in this shared file, every *_STUDIO_RPC
#  symbol that defaults y (kscan diagnostics does) turned
#  on for the peripheral and broke its link.
# =======================================================

# ---------- Diagnostics / telemetry: base on BOTH halves ----------
# These hook kscan or answer over the split relay rather than the keymap,
# so the peripheral builds them cleanly and answers relayed queries with the
# base symbol alone (no Studio needed on the left).
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y

# Settings tab (sleep/idle timeouts). Needs zmk_activity_set_idle_ms /
# _get_sleep_ms, which exist in cormoran's main+dya fork -- now pinned in
# west.yml, so this builds on both halves.
CONFIG_ZMK_SETTINGS_RPC=y

# Relay payload ceiling: kscan diagnostics BUILD_ASSERTs 256 for a GpioPins
# page reply (settings-rpc would default this to 64). Watchdog streams one
# incident per relay event, so it never needs more than this.
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256

# ---------- Stability watchdog: base on BOTH halves ----------
# Explicitly wants both halves so the peripheral's own incident log is
# reachable through the central's cormoran__watchdog subsystem
# (ZMK_WATCHDOG_SPLIT_RELAY defaults y here via ZMK_SPLIT).
CONFIG_ZMK_WATCHDOG=y

# Start conservative: this build is a working BLE split central, and this
# module documents a low-probability radio-timing conflict with the nRF
# controller's ~275us event-prep window. Incident logging + hard-fault
# capture (ZMK_WATCHDOG_FATAL_DETECT, default y) stay on; freeze detection
# adds the periodic k_timer load. Arm it once this is stable -- see
# charybdis_right.conf for the follow-up knobs.
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
